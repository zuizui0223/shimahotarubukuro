[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shimaflora"
version = "0.1.0"
description = "Reproducible image phenotyping of floral morphology and intrafloral colour patterns"
readme = "PACKAGE_README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ZHANG Ruiqi"}]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "scikit-learn>=1.3",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Repository = "https://github.com/zuizui0223/shimahotarubukuro"

[tool.setuptools.packages.find]
where = ["src"]
include = ["shimaflora*"]
namespaces = true
