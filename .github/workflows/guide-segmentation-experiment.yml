name: guide-segmentation-experiment

on:
  workflow_dispatch:
  push:
    branches: [agent/adaptive-guide-segmentation]
    paths:
      - "src/shimaflora/measurement/guide_segmentation_experiment.py"
      - ".github/workflows/guide-segmentation-experiment.yml"
      - "shimask/**"
      - "shimahotarubukuro/**"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pipeline and GMM dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "scikit-learn>=1.6,<1.8"
      - name: Compare fixed threshold with adaptive GMM
        env:
          PYTHONPATH: ${{ github.workspace }}/src/shimaflora/core:${{ github.workspace }}/src/shimaflora/measurement:${{ github.workspace }}/src/shimaflora/metadata:${{ github.workspace }}/src/shimaflora/analysis:${{ github.workspace }}/src/shimaflora/figures:${{ github.workspace }}/src/shimaflora/audit
        run: python src/shimaflora/measurement/guide_segmentation_experiment.py
      - name: Upload comparison tables and overlays
        uses: actions/upload-artifact@v4
        with:
          name: guide-segmentation-comparison
          path: results_shimask_all/guide_segmentation_experiment/**
          if-no-files-found: error
