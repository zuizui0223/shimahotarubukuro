name: Publish ShimaFlora release

on:
  workflow_run:
    workflows: ["reproduce-pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.repository == 'zuizui0223/shimahotarubukuro' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and test package
        run: |
          python -m pip install --upgrade pip
          pip install . pytest build
          pytest -q tests/test_package_api.py tests/test_qc_and_examples.py
          python - <<'PY'
          import pathlib, tomllib, shimaflora
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert shimaflora.__version__ == version, (shimaflora.__version__, version)
          print(version)
          PY
      - name: Build wheel and source distribution
        run: python -m build
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          VERSION=$(python - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          PY
          )
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; leaving the published release unchanged"
          else
            gh release create "$TAG" dist/* \
              --target "$TARGET_SHA" \
              --title "ShimaFlora $TAG" \
              --generate-notes
          fi
