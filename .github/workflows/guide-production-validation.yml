name: validate-gmm-guide-production

on:
  workflow_dispatch:
  push:
    branches: [agent/adaptive-guide-segmentation]
    paths:
      - "src/shimaflora/measurement/guide_colour_model.py"
      - "src/shimaflora/measurement/guide_traits.py"
      - "src/shimaflora/measurement/merge_traits.py"
      - "src/shimaflora/audit/make_overlays.py"
      - "requirements.txt"
      - ".github/workflows/guide-production-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Preserve non-guide reference tables
        run: |
          cp results_shimask_all/medial_traits.csv /tmp/medial_traits.csv
          cp results_shimask_all/iphone_traits.csv /tmp/iphone_traits.csv
          cp results_shimask_all/organ_traits.csv /tmp/organ_traits.csv
          cp results_shimask_all/pollination_traits.csv /tmp/pollination_traits.csv
      - name: Run complete publication pipeline
        run: bash run_pipeline.sh
      - name: Prove size and organ measurements are unchanged
        run: |
          cmp /tmp/medial_traits.csv results_shimask_all/medial_traits.csv
          cmp /tmp/iphone_traits.csv results_shimask_all/iphone_traits.csv
          cmp /tmp/organ_traits.csv results_shimask_all/organ_traits.csv
          cmp /tmp/pollination_traits.csv results_shimask_all/pollination_traits.csv
      - name: Refresh guide-dependent publication tables
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A results_shimask_all/*.csv
          if git diff --cached --quiet; then
            echo "No guide-dependent table changes."
          else
            git commit -m "Refresh GMM guide results"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload guide tables and figures
        uses: actions/upload-artifact@v4
        with:
          name: gmm-guide-production-results
          path: |
            results_shimask_all/*.csv
            results_shimask_all/*.png
            results_shimask_all/measure_cards/*.png
            results_shimask_all/paper_overlays/*.png
          if-no-files-found: warn
